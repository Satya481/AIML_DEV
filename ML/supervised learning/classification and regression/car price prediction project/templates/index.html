<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Car Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body class="bg-dark">
    <div class="container">
        <div class="row">
            <div class="col">
                <h1 class="text-white">Car Price Prediction</h1>
                <form id="predictForm">
                    <div class="mb-3">
                        <label for="company" class="form-label text-white">Company</label>
                        <select class="form-select" id="company" name="company">
                            <option value="">Select Company</option>
                            {% for company in companies %}
                                <option value="{{ company }}">{{ company }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="car_model" class="form-label text-white">Car Model</label>
                        <select class="form-select" id="car_model" name="car_model">
                            <option value="">Select Model</option>
                            {% for model in car_models %}
                                <option value="{{ model }}">{{ model }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="year" class="form-label text-white">Year</label>
                        <select class="form-select" id="year" name="year">
                            {% for year in years %}
                                <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="fuel_type" class="form-label text-white">Fuel Type</label>
                        <select class="form-select" id="fuel_type" name="fuel_type">
                            {% for fuel in fuel_types %}
                                <option value="{{ fuel }}">{{ fuel }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="km_driven" class="form-label text-white">Number of KM Travelled</label>
                        <input type="number" class="form-control" id="km_driven" name="km_driven" placeholder="Enter kilometers driven" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Predict Price</button>
                </form>
                <div id="predictionResult" class="mt-3 text-white"></div>
            </div>
        </div>
    </div>
    <script>
      // Get the mapping from Flask as a JS object
      const companyModelMap = {{ company_model_map|tojson | safe }};
      const companySelect = document.getElementById('company');
      const modelSelect = document.getElementById('car_model');

      companySelect.addEventListener('change', function() {
        const selectedCompany = this.value;
        // Remove all options except the first
        modelSelect.options.length = 1;
        if (selectedCompany && companyModelMap[selectedCompany]) {
          companyModelMap[selectedCompany].forEach(function(model) {
            const option = document.createElement('option');
            option.value = model;
            option.text = model;
            modelSelect.appendChild(option);
          });
        }
      });

      // Handle form submission
      document.getElementById('predictForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
          company: document.getElementById('company').value,
          car_model: document.getElementById('car_model').value,
          year: document.getElementById('year').value,
          fuel_type: document.getElementById('fuel_type').value,
          km_driven: document.getElementById('km_driven').value
        };
        fetch('/predict', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
          if(result.predicted_price !== undefined) {
            document.getElementById('predictionResult').innerHTML = 
              `<h4>Predicted Price: <span class="badge bg-success">₹${Number(result.predicted_price).toLocaleString()}</span></h4>`;
          } else {
            document.getElementById('predictionResult').innerText = 'Error: ' + (result.error || 'Unknown error');
          }
        })
        .catch(error => {
          document.getElementById('predictionResult').innerText = 'Error: ' + error;
        });
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
